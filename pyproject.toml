[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "name-variants"
version = "0.1.0"
description = "Bidirectional lookup of personal name variants and canonical forms"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["names", "name-matching", "nlp", "entity-resolution", "genealogy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/campbelltaylor-bw/name-variants"
"Bug Tracker" = "https://github.com/campbelltaylor-bw/name-variants/issues"

[project.optional-dependencies]
fuzzy = ["rapidfuzz>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "hatch",
]

[project.scripts]
name-variants = "name_variants._cli:_main"

[tool.hatch.build.targets.wheel]
packages = ["src/name_variants"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "scripts/",
    "tests/",
    "README.md",
    "LICENSE",
]

[tool.hatch.build]
artifacts = [
    "src/name_variants/data/*.json",
    "src/name_variants/data/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
